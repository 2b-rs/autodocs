<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>autodocs — Redirecting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
  (function() {
    var SUPPORTED = ["de", "en", "es", "pt", "fr", "ru", "ar", "hi", "ko", "zh", "nl"];
    function matchLang(tag) {
      if (!tag || typeof tag !== "string") return null;
      var norm = tag.trim().toLowerCase().replace(/_/g, "-");
      if (!norm) return null;
      if (SUPPORTED.indexOf(norm) !== -1) return norm;
      var code = norm.split("-")[0];
      return SUPPORTED.indexOf(code) !== -1 ? code : null;
    }
    var p = window.location.pathname;
    var legacyPrefixes = ["/classic/", "/adaptive/", "/namespaces/", "/services/", "/classes/", "/modules/", "/spec/"];
    for (var i = 0; i < legacyPrefixes.length; i++) {
      var idx = p.indexOf(legacyPrefixes[i]);
      if (idx !== -1) {
        var rel = p.substring(idx);
        var targetLang = "de";
        try {
          targetLang = matchLang(localStorage.getItem("autodocs_user_lang")) || "de";
        } catch (e) {}
        window.location.replace("/" + targetLang + rel + window.location.search + window.location.hash);
        return;
      }
    }
  })();
  </script>
</head>
<body style="font-family:sans-serif; text-align:center; padding: 4rem 1rem;">
  <h2>404 — Seite nicht gefunden</h2>
  <p><a href="./de/index.html">Zur Startseite</a></p>
</body>
</html>
