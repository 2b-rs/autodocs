<svg xmlns="http://www.w3.org/2000/svg" viewbox="0 0 1110 450" font-family="Helvetica,sans-Serif" style="max-width:1110px"><text x="555.0" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#28251d">Отчетность и обработка Security Events</text><line x1="135" y1="102" x2="135" y2="436" stroke="#8a867c" stroke-dasharray="4,4" stroke-width="1"></line><line x1="345" y1="102" x2="345" y2="436" stroke="#8a867c" stroke-dasharray="4,4" stroke-width="1"></line><line x1="555" y1="102" x2="555" y2="436" stroke="#8a867c" stroke-dasharray="4,4" stroke-width="1"></line><line x1="765" y1="102" x2="765" y2="436" stroke="#8a867c" stroke-dasharray="4,4" stroke-width="1"></line><line x1="975" y1="102" x2="975" y2="436" stroke="#8a867c" stroke-dasharray="4,4" stroke-width="1"></line><rect x="42" y="56" width="186" height="38" fill="#ffffff" stroke="#01696f" stroke-width="1.2"></rect><text x="135" y="79.0" text-anchor="middle" font-size="12" fill="#01696f">Датчик/Приложение</text><a class="vis-app" href="../classes/cl_ara_idsm_EventReporter_a34c7d.html"><rect x="252" y="56" width="186" height="38" fill="#ffffff" stroke="#01696f" stroke-width="1.2"></rect><text x="345" y="79.0" text-anchor="middle" font-size="12" fill="#01696f" text-decoration="underline">EventReporter</text></a><rect x="462" y="56" width="186" height="38" fill="#ffffff" stroke="#01696f" stroke-width="1.2"></rect><text x="555" y="79.0" text-anchor="middle" font-size="12" fill="#01696f">IdsM</text><a class="vis-app" href="../classes/cl_ara_idsm_ContextDataProvider_725af1.html"><rect x="672" y="56" width="186" height="38" fill="#ffffff" stroke="#01696f" stroke-width="1.2"></rect><text x="765" y="79.0" text-anchor="middle" font-size="12" fill="#01696f" text-decoration="underline">ContextDataProvider</text></a><rect x="882" y="56" width="186" height="38" fill="#ffffff" stroke="#01696f" stroke-width="1.2"></rect><text x="975" y="72.5" text-anchor="middle" font-size="12" fill="#01696f">SEM (концептуальный) /</text><text x="975" y="85.5" text-anchor="middle" font-size="12" fill="#01696f">IdsR</text><defs><marker id="arrF" markerwidth="11" markerheight="9" refx="10" refy="4.5" orient="auto"><polygon points="0 0, 11 4.5, 0 9" fill="#28251d"></polygon></marker></defs><text x="240.0" y="126" text-anchor="middle" font-size="11" fill="#28251d">ReportEvent(...)</text><line x1="135" y1="132" x2="345" y2="132" stroke="#28251d" stroke-width="1.1" marker-end="url(#arrF)"></line><text x="450.0" y="160" text-anchor="middle" font-size="11" fill="#28251d">Сообщить Security Event</text><line x1="345" y1="166" x2="555" y2="166" stroke="#28251d" stroke-width="1.1" marker-end="url(#arrF)"></line><text x="660.0" y="194" text-anchor="middle" font-size="11" fill="#28251d">ModifyContextData(...)</text><text x="660.0" y="207" text-anchor="middle" font-size="11" fill="#28251d">[необязательно]</text><line x1="555" y1="213" x2="765" y2="213" stroke="#28251d" stroke-width="1.1" marker-end="url(#arrF)"></line><text x="660.0" y="241" text-anchor="middle" font-size="11" fill="#28251d">модифицированный</text><text x="660.0" y="254" text-anchor="middle" font-size="11" fill="#28251d">Контекстные данные</text><line x1="765" y1="260" x2="555" y2="260" stroke="#28251d" stroke-width="1.1" marker-end="url(#arrF)"></line><path d="M 555 274 h 46 v 22 h -46" fill="none" stroke="#28251d" stroke-width="1.1" marker-end="url(#arrF)"></path><text x="609" y="289" text-anchor="start" font-size="11" fill="#28251d">квалифицировать, фильтровать и</text><text x="609" y="302" text-anchor="start" font-size="11" fill="#28251d">Применить отчеты Mode</text><text x="765.0" y="338" text-anchor="middle" font-size="11" fill="#28251d">Сохранить или переслать QSEv</text><line x1="555" y1="344" x2="975" y2="344" stroke="#28251d" stroke-width="1.1" marker-end="url(#arrF)"></line><path d="M 587.5 361 h 345 l 10 10 v 45 h -355 z" fill="#f0eeea" stroke="#8a867c" stroke-width="1"></path><path d="M 932.5 361 v 10 h 10" fill="none" stroke="#8a867c" stroke-width="1"></path><text x="595.5" y="375" font-size="11" fill="#28251d">Согласно EXP_PlatformDesign, SEM соответствует одному</text><text x="595.5" y="388" font-size="11" fill="#28251d">позже объявлено о стандартизации; здесь:</text><text x="595.5" y="401" font-size="11" fill="#28251d">локальная персистенция / IdsR.</text></svg>
