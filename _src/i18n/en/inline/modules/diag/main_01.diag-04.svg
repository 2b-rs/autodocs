<svg xmlns="http://www.w3.org/2000/svg" viewbox="0 0 690 619" font-family="Helvetica,sans-Serif" style="max-width:690px"><text x="345.0" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#28251d">UDS error responses and Response Pending</text><line x1="135" y1="102" x2="135" y2="605" stroke="#8a867c" stroke-dasharray="4,4" stroke-width="1"></line><line x1="345" y1="102" x2="345" y2="605" stroke="#8a867c" stroke-dasharray="4,4" stroke-width="1"></line><line x1="555" y1="102" x2="555" y2="605" stroke="#8a867c" stroke-dasharray="4,4" stroke-width="1"></line><rect x="42" y="56" width="186" height="38" fill="#ffffff" stroke="#01696f" stroke-width="1.2"></rect><text x="135" y="79.0" text-anchor="middle" font-size="12" fill="#01696f">Diagnostic tester</text><rect x="252" y="56" width="186" height="38" fill="#ffffff" stroke="#01696f" stroke-width="1.2"></rect><text x="345" y="79.0" text-anchor="middle" font-size="12" fill="#01696f">Diagnostic Server (DM)</text><a class="vis-app" href="../classes/cl_ara_diag_GenericUDSService_733cac.html"><rect x="462" y="56" width="186" height="38" fill="#ffffff" stroke="#01696f" stroke-width="1.2"></rect><text x="555" y="79.0" text-anchor="middle" font-size="12" fill="#01696f" text-decoration="underline">GenericUDSService</text></a><defs><marker id="arrF" markerwidth="11" markerheight="9" refx="10" refy="4.5" orient="auto"><polygon points="0 0, 11 4.5, 0 9" fill="#28251d"></polygon></marker></defs><rect x="40" y="184" width="610" height="401" fill="none" stroke="#8a867c" stroke-width="1.1"></rect><text x="240.0" y="126" text-anchor="middle" font-size="11" fill="#28251d">UDS request</text><line x1="135" y1="132" x2="345" y2="132" stroke="#28251d" stroke-width="1.1" marker-end="url(#arrF)"></line><text x="450.0" y="160" text-anchor="middle" font-size="11" fill="#28251d">HandleMessage(sid, data, ... )</text><line x1="345" y1="166" x2="555" y2="166" stroke="#28251d" stroke-width="1.1" marker-end="url(#arrF)"></line><path d="M 40 184 h 46 v 14 l -8 8 h -38 z" fill="#f0eeea" stroke="#8a867c" stroke-width="1"></path><text x="48" y="199" font-size="11" font-weight="bold" fill="#28251d">alt</text><text x="96" y="199" font-size="11" font-style="italic" fill="#28251d">[Future-Fehler: DiagUdsNrcErrc]</text><text x="450.0" y="224" text-anchor="middle" font-size="11" fill="#28251d">Future error with NRC</text><line x1="555" y1="230" x2="345" y2="230" stroke="#28251d" stroke-width="1.1" stroke-dasharray="6,4" marker-end="url(#arrF)"></line><text x="240.0" y="258" text-anchor="middle" font-size="11" fill="#28251d">negative response with NRC</text><line x1="345" y1="264" x2="135" y2="264" stroke="#28251d" stroke-width="1.1" stroke-dasharray="6,4" marker-end="url(#arrF)"></line><line x1="40" y1="286" x2="650" y2="286" stroke="#8a867c" stroke-width="1" stroke-dasharray="5,3"></line><text x="52" y="301" font-size="11" font-style="italic" fill="#28251d">[P2/P2* exceeded]</text><text x="240.0" y="329" text-anchor="middle" font-size="11" fill="#28251d">NRC 0x78 (ResponsePending)</text><line x1="345" y1="335" x2="135" y2="335" stroke="#28251d" stroke-width="1.1" stroke-dasharray="6,4" marker-end="url(#arrF)"></line><path d="M 129.0 352 h 212 l 10 10 v 32 h -222 z" fill="#f0eeea" stroke="#8a867c" stroke-width="1"></path><path d="M 341.0 352 v 10 h 10" fill="none" stroke="#8a867c" stroke-width="1"></path><text x="137.0" y="366" font-size="11" fill="#28251d">0x78 can continue until completion</text><text x="137.0" y="379" font-size="11" fill="#28251d">be repeated during service processing.</text><text x="450.0" y="418" text-anchor="middle" font-size="11" fill="#28251d">final Future result</text><line x1="555" y1="424" x2="345" y2="424" stroke="#28251d" stroke-width="1.1" stroke-dasharray="6,4" marker-end="url(#arrF)"></line><text x="240.0" y="452" text-anchor="middle" font-size="11" fill="#28251d">final positive or NRC response</text><line x1="345" y1="458" x2="135" y2="458" stroke="#28251d" stroke-width="1.1" stroke-dasharray="6,4" marker-end="url(#arrF)"></line><line x1="40" y1="480" x2="650" y2="480" stroke="#8a867c" stroke-width="1" stroke-dasharray="5,3"></line><text x="52" y="495" font-size="11" font-style="italic" fill="#28251d">[Maximum for 0x78 reached]</text><text x="450.0" y="523" text-anchor="middle" font-size="11" fill="#28251d">Cancel processing</text><line x1="345" y1="529" x2="555" y2="529" stroke="#28251d" stroke-width="1.1" marker-end="url(#arrF)"></line><text x="240.0" y="557" text-anchor="middle" font-size="11" fill="#28251d">NRC 0x10 (generalReject)</text><line x1="345" y1="563" x2="135" y2="563" stroke="#28251d" stroke-width="1.1" stroke-dasharray="6,4" marker-end="url(#arrF)"></line></svg>
