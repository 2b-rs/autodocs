  <link rel="alternate" hreflang="en" href="./en/" />

  <link rel="alternate" hreflang="zh" href="./zh/" />
  <link rel="alternate" hreflang="nl" href="./nl/" />
  <link rel="alternate" hreflang="x-default" href="./de/" />
  <link rel="stylesheet" href="style.css">
  <script>
  (function() {
    var SUPPORTED = ["de", "en", "es", "pt", "fr", "ru", "ar", "hi", "ko", "zh", "nl"];
    function matchLang(tag) {
      if (!tag || typeof tag !== "string") return null;
      var norm = tag.trim().toLowerCase().replace(/_/g, "-");
      if (!norm) return null;
      if (SUPPORTED.indexOf(norm) !== -1) return norm;
      var code = norm.split("-")[0];
      return SUPPORTED.indexOf(code) !== -1 ? code : null;
    }
    var saved = null;
    try {
      saved = matchLang(localStorage.getItem("autodocs_user_lang"));
    } catch (e) {}
    if (saved) {
      window.location.replace("./" + saved + "/");
      return;
    }
    var navLangs = navigator.languages || [navigator.language || "de"];
    for (var i = 0; i < navLangs.length; i++) {
      var code = matchLang(navLangs[i]);
      if (code) {
        window.location.replace("./" + code + "/");
        return;
      }
    }
    window.location.replace("./de/");
  })();
  </script>
</head>
