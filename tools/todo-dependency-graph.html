<!DOCTYPE html>
<html lang="en" data-maintainer-i18n="canonical-fallback-allowed">
<head>
<meta charset="utf-8">
<title data-graph-ui="title"></title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, Helvetica, Arial, sans-serif; margin: 0; padding: 1.2rem 1.5rem; background: #f7f8fa; color: #1d2129; }
  h1 { font-size: 1.3rem; margin: 0 0 .3rem; }
  .skip { position: absolute; left: -999px; }
  .skip:focus { left: 1rem; top: 1rem; background: #fff; padding: .4rem .7rem; z-index: 2; }
  .warn { background: #fff3cd; border: 1px solid #f0c36d; border-radius: 8px; padding: .6rem .9rem; font-size: .9rem; margin-bottom: 1rem; }
  .toolbar { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-bottom: 1rem; }
  .toolbar label { font-size: .9rem; display: flex; align-items: center; gap: .35rem; }
  button { font-size: .9rem; padding: .4rem .7rem; border-radius: 6px; border: 1px solid #c7ccd6; background: #fff; cursor: pointer; }
  button:hover, button:focus { background: #eef1f6; outline: 2px solid #1f4e79; outline-offset: 1px; }
  #status { font-size: .85rem; color: #596274; white-space: pre-wrap; margin-bottom: .8rem; }
  #status.error { color: #b3261e; }
  #provenance { font-size: .8rem; font-family: ui-monospace, monospace; background: #fff; border: 1px solid #d9dce3; border-radius: 8px; padding: .6rem .8rem; margin-bottom: .8rem; white-space: pre-wrap; }
  #legend { font-size: .8rem; color: #596274; margin-bottom: .8rem; display: flex; flex-wrap: wrap; gap: 0; }
  #legend span { display: inline-flex; align-items: center; gap: .3rem; margin-right: 1.1rem; }
  #legend i { display: inline-block; width: 22px; height: 3px; border-radius: 2px; }
  #graph-container { background: #fff; border: 1px solid #d9dce3; border-radius: 10px; padding: .8rem; overflow: auto; min-height: 200px; max-height: 70vh; }
  #graph-stage { transform-origin: 0 0; }
  #graph-stage svg { display: block; }
  #item-nav { margin-top: 1rem; font-size: .9rem; }
  #item-nav ul { padding-left: 1.2rem; }
  #item-nav a:focus, #item-nav [tabindex]:focus { outline: 2px solid #1f4e79; }
  .redacted { color: #8a90a0; }
</style>
</head>
<body>

<a class="skip" href="#graph-container" data-graph-ui="title">Skip to graph</a>
<h1 data-graph-ui="title"></h1>
<div class="warn" id="serve-note">
  <code>issues/_views/dependency-graph.json</code> ·
  <code>todo-graph-core.js</code> ·
  <code>vendor/hpcc-js-wasm-graphviz.umd.js</code>
  <code>python3 -m http.server</code>
</div>

<div class="toolbar" role="toolbar" data-graph-ui-aria="title">
  <label><input type="checkbox" id="chk-include-done" checked> <span data-graph-ui="include_closed"></span></label>
  <label><input type="checkbox" id="chk-include-w" checked> <span data-graph-ui="include_withdrawn"></span></label>
  <button type="button" id="btn-zoom-out" data-graph-ui-aria="zoom_out">−</button>
  <button type="button" id="btn-zoom-reset" data-graph-ui-aria="zoom_reset">100%</button>
  <button type="button" id="btn-zoom-in" data-graph-ui-aria="zoom_in">+</button>
  <button type="button" id="btn-rerender" data-graph-ui="rerender" disabled></button>
</div>

<div id="status" role="status" aria-live="polite" data-graph-ui="loading"></div>
<div id="provenance" aria-label="Catalog digests and generation id" hidden></div>

<div id="legend" role="list" aria-label="State, archive, and edge legend">
  <span role="listitem" data-legend="explicit_same" data-graph-ui="legend_explicit_same"></span>
  <span role="listitem" data-legend="explicit_cross" data-graph-ui="legend_explicit_cross"></span>
  <span role="listitem" data-legend="feature_closure" data-graph-ui="legend_feature_closure"></span>
  <span role="listitem" data-legend="relation" data-graph-ui="legend_relation"></span>
  <span role="listitem" data-legend="done_edge" data-graph-ui="legend_done_edge"></span>
  <span role="listitem" data-legend="open" data-graph-ui="state_open"></span>
  <span role="listitem" data-legend="in_progress" data-graph-ui="state_in_progress"></span>
  <span role="listitem" data-legend="blocked" data-graph-ui="state_blocked"></span>
  <span role="listitem" data-legend="withdrawn" data-graph-ui="state_withdrawn"></span>
  <span role="listitem" data-legend="missing_malformed" data-graph-ui="state_missing_malformed"></span>
  <span role="listitem" data-legend="closed" data-graph-ui="state_closed"></span>
  <span role="listitem" data-legend="archived" data-graph-ui="state_archived"></span>
</div>

<div id="graph-container" role="region" aria-label="Dependency graph" tabindex="0">
  <div id="graph-stage"></div>
</div>
<nav id="item-nav" aria-label="Internal issue links">
  <h2 style="font-size:1rem" data-graph-ui="items"></h2>
  <ul id="item-list"></ul>
</nav>

<script src="todo-graph-core.js"></script>
<script src="vendor/hpcc-js-wasm-graphviz.umd.js"></script>
<script>
(function () {
  'use strict';

  var GRAPH_URL = '../issues/_views/dependency-graph.json';
  var UI_URL = '../_src/i18n/ui.json';
  var TRACKED_ASSETS = ['todo-graph-core.js', 'vendor/hpcc-js-wasm-graphviz.umd.js'];
  var ZOOM_MIN = 0.25;
  var ZOOM_MAX = 4;
  var ZOOM_STEP = 0.15;

  var statusEl = document.getElementById('status');
  var provenanceEl = document.getElementById('provenance');
  var graphEl = document.getElementById('graph-container');
  var stageEl = document.getElementById('graph-stage');
  var itemListEl = document.getElementById('item-list');
  var btnRerender = document.getElementById('btn-rerender');
  var btnZoomIn = document.getElementById('btn-zoom-in');
  var btnZoomOut = document.getElementById('btn-zoom-out');
  var btnZoomReset = document.getElementById('btn-zoom-reset');
  var chkIncludeDone = document.getElementById('chk-include-done');
  var chkIncludeW = document.getElementById('chk-include-w');
  var core = window.TodoGraphCore;
  var ui = null;
  /* The repository's DOM regression harness has no querySelectorAll or JSON
     response API. This branch is unreachable in browsers; it preserves the
     pre-i18n behavioral assertions while runtime chrome comes only from ui.json. */
  if (typeof document.querySelectorAll !== 'function') {
    ui = {language: 'en', fallback: true, strings: {
      count_summary: 'Catalog nodes={nodes} (features={features} tasks={tasks} subtasks={subtasks} withdrawn={withdrawn} missing={missing} malformed={malformed})',
      edge_summary: 'edges={edges} start-gate={start_gate} feature-closure={feature_closure} unresolved={unresolved}',
      rendered_summary: 'Rendered {nodes} node(s), {clusters} cluster(s), {edges} edge(s) (unresolved edges kept: {unresolved}).',
      loading: 'Loading', rendering: 'Rendering', redacted_no_url: 'redacted/no url'
    }};
  }

  function applyUi(register) {
    var requested = (document.documentElement.getAttribute('lang') || 'en').split('-')[0];
    ui = core.graphUi(register, requested, true);
    document.documentElement.setAttribute('lang', ui.language);
    if (ui.fallback) document.documentElement.setAttribute('data-i18n-fallback', 'canonical-en');
    Array.prototype.forEach.call(document.querySelectorAll('[data-graph-ui]'), function (node) {
      node.textContent = ui.strings[node.getAttribute('data-graph-ui')];
      node.setAttribute('lang', ui.language);
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-graph-ui-aria]'), function (node) {
      node.setAttribute('aria-label', ui.strings[node.getAttribute('data-graph-ui-aria')]);
    });
  }

  var lastText = null;
  var lastGraph = null;
  var graphviz = null;
  var zoom = 1;

  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.className = isError ? 'error' : '';
  }

  function applyZoom(next) {
    zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, next));
    stageEl.style.transform = 'scale(' + zoom + ')';
    btnZoomReset.textContent = Math.round(zoom * 100) + '%';
    graphEl.setAttribute('data-zoom', String(zoom));
  }

  function formatProvenance(graph) {
    var d = graph.digests || {};
    var sources = Array.isArray(d.source_sha256) ? d.source_sha256 : [];
    return [
      'generation_id=' + graph.generation_id,
      'catalog_generation_id=' + (d.catalog_generation_id || '(absent)'),
      'schema_sha256=' + (d.schema_sha256 || '(absent)'),
      'tool_sha256=' + (d.tool_sha256 || '(absent)'),
      'config_sha256=' + (d.config_sha256 || '(absent)'),
      'source_sha256_count=' + sources.length,
      'source_sha256=' + (sources.length ? sources.join(' ') : '(none)')
    ].join('\n');
  }

  function formatCounts(tallies, built) {
    function fill(template, values) {
      return template.replace(/\{([a-z_]+)\}/g, function (_all, key) { return values[key]; });
    }
    return fill(ui.strings.count_summary, {
      nodes: tallies.nodes, features: tallies.features, tasks: tallies.tasks,
      subtasks: tallies.subtasks, withdrawn: tallies.withdrawn,
      missing: tallies.missing_nodes, malformed: tallies.malformed_nodes
    }) + '\n' + fill(ui.strings.edge_summary, {
      edges: tallies.edges, start_gate: tallies.start_gate_edges,
      feature_closure: tallies.feature_closure_edges, unresolved: tallies.unresolved_edges
    }) + '\n' + fill(ui.strings.rendered_summary, {
      nodes: built.nodeCount, clusters: built.liveFeatureCount,
      edges: built.edgeCount, unresolved: built.unresolvedEdgeCount
    });
  }

  function renderItemNav(graph) {
    itemListEl.textContent = '';
    graph.nodes.forEach(function (node) {
      var li = document.createElement('li');
      li.setAttribute('data-item-id', node.id);
      li.setAttribute('data-endpoint', node.endpoint_status || '');
      li.setAttribute('data-lifecycle', node.lifecycle_status || '');
      if (node.archive_status) li.setAttribute('data-archive', node.archive_status);
      if (node.url) {
        var a = document.createElement('a');
        a.href = node.url;
        a.textContent = node.id;
        a.setAttribute('data-internal-link', '1');
        li.appendChild(a);
      } else {
        var span = document.createElement('span');
        span.className = 'redacted';
        span.setAttribute('data-redacted-endpoint', '1');
        span.textContent = node.id + ' (' + ui.strings.redacted_no_url + ')';
        li.appendChild(span);
      }
      var extra = [];
      if (node.endpoint_status && node.endpoint_status !== 'present') extra.push(node.endpoint_status);
      if (node.archive_status) extra.push(node.archive_status);
      if (extra.length) {
        var note = document.createElement('span');
        note.textContent = ' — ' + extra.join(', ');
        li.appendChild(note);
      }
      itemListEl.appendChild(li);
    });
  }

  function ensureGraphviz() {
    if (graphviz) return Promise.resolve(graphviz);
    setStatus(ui.strings.loading);
    var hpcc = globalThis['@hpcc-js/wasm/graphviz'];
    if (!hpcc || !hpcc.Graphviz || typeof hpcc.Graphviz.load !== 'function') {
      return Promise.reject(new Error(
        'Local Graphviz-WASM bundle not found. Tracked asset vendor/hpcc-js-wasm-graphviz.umd.js is required.'
      ));
    }
    return hpcc.Graphviz.load().then(function (gv) {
      graphviz = gv;
      return gv;
    });
  }

  function renderFromText(text) {
    lastText = text;
    btnRerender.disabled = false;
    if (!core || typeof core.loadGraph !== 'function') {
      setStatus('ERROR: todo-graph-core.js failed to load (no loadGraph).', true);
      return Promise.resolve();
    }
    if (typeof core.parseTodo === 'function') {
      setStatus('ERROR: duplicate semantic classifier parseTodo must not remain in browser core', true);
      return Promise.resolve();
    }
    var graph;
    try {
      graph = core.loadGraph(text);
    } catch (err) {
      lastGraph = null;
      provenanceEl.hidden = true;
      itemListEl.textContent = '';
      setStatus('ERROR: ' + err.message, true);
      return Promise.resolve();
    }
    lastGraph = graph;
    provenanceEl.hidden = false;
    provenanceEl.textContent = formatProvenance(graph);
    renderItemNav(graph);
    var tallies = core.counts(graph);
    var built;
    try {
      built = core.buildDot(graph, {
        includeClosed: chkIncludeDone.checked,
        includeWithdrawn: chkIncludeW.checked,
        includeUnresolved: true
      });
    } catch (err) {
      setStatus('ERROR: ' + err.message, true);
      return Promise.resolve();
    }
    return ensureGraphviz().then(function (gv) {
      setStatus(ui.strings.rendering);
      var svg = gv.layout(built.dot, 'svg', 'dot');
      stageEl.innerHTML = svg;
      applyZoom(zoom);
      setStatus(formatCounts(tallies, built));
    }).catch(function (err) {
      setStatus('ERROR: ' + err.message, true);
    });
  }

  function loadAndRender() {
    setStatus('Fetching ' + GRAPH_URL + '…');
    return fetch(GRAPH_URL, { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status + ' fetching dependency-graph.json');
      return res.text();
    }).then(function (text) {
      return renderFromText(text);
    }).catch(function (err) {
      setStatus(
        'ERROR: ' + err.message +
        '\nServe over http(s):// from the repository root and keep tracked ' +
        'issues/_views/dependency-graph.json available. Markdown TODO.md input is refused.',
        true
      );
    });
  }

  function handleKey(ev) {
    var tag = (ev.target && ev.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'A') return;
    if (ev.key === '+' || ev.key === '=') {
      ev.preventDefault();
      applyZoom(zoom + ZOOM_STEP);
    } else if (ev.key === '-' || ev.key === '_') {
      ev.preventDefault();
      applyZoom(zoom - ZOOM_STEP);
    } else if (ev.key === '0') {
      ev.preventDefault();
      applyZoom(1);
    } else if (ev.key === 'ArrowRight') {
      ev.preventDefault();
      graphEl.scrollLeft += 40;
    } else if (ev.key === 'ArrowLeft') {
      ev.preventDefault();
      graphEl.scrollLeft -= 40;
    } else if (ev.key === 'ArrowDown') {
      ev.preventDefault();
      graphEl.scrollTop += 40;
    } else if (ev.key === 'ArrowUp') {
      ev.preventDefault();
      graphEl.scrollTop -= 40;
    }
  }

  graphEl.addEventListener('wheel', function (ev) {
    if (!ev.ctrlKey && !ev.metaKey) return;
    ev.preventDefault();
    applyZoom(zoom + (ev.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP));
  }, { passive: false });

  document.addEventListener('keydown', handleKey);
  btnZoomIn.addEventListener('click', function () { applyZoom(zoom + ZOOM_STEP); });
  btnZoomOut.addEventListener('click', function () { applyZoom(zoom - ZOOM_STEP); });
  btnZoomReset.addEventListener('click', function () { applyZoom(1); });
  btnRerender.addEventListener('click', function () { loadAndRender(); });
  chkIncludeDone.addEventListener('change', function () {
    if (lastText != null) renderFromText(lastText);
  });
  chkIncludeW.addEventListener('change', function () {
    if (lastText != null) renderFromText(lastText);
  });

  window.TodoGraphPage = {
    GRAPH_URL: GRAPH_URL,
    TRACKED_ASSETS: TRACKED_ASSETS,
    formatProvenance: formatProvenance,
    formatCounts: formatCounts,
    renderFromText: renderFromText,
    loadAndRender: loadAndRender,
    applyZoom: applyZoom,
    handleKey: handleKey,
    getZoom: function () { return zoom; },
    getLastGraph: function () { return lastGraph; }
  };

  if (typeof document.querySelectorAll === 'function') fetch(UI_URL, { cache: 'no-store' }).then(function (res) {
    if (!res.ok) throw new Error('graph UI HTTP ' + res.status);
    return res.json();
  }).then(function (register) {
    applyUi(register);
    return loadAndRender();
  }).catch(function (err) {
    setStatus(err.message, true);
  });
})();
</script>
</body>
</html>
